<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif">
  <title>How the VEX Auton Visualizer works: one source file, two linkers</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7581"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5651d"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb0"/>
    </marker>
  </defs>

  <!-- solid background so the diagram reads in GitHub's dark mode too -->
  <rect x="0.5" y="0.5" width="1199" height="699" rx="16" fill="#ffffff" stroke="#e2e6ec"/>

  <!-- title -->
  <text x="48" y="60" font-size="26" font-weight="600" fill="#1c2128">One source file, two linkers</text>
  <text x="48" y="90" font-size="15" fill="#6b7581">autons.cpp is compiled unmodified. The only thing that changes is which function bodies the linker supplies.</text>

  <!-- ============ column 1: the source file ============ -->
  <rect x="48" y="150" width="270" height="270" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="68" y="182" font-size="17" font-weight="600" fill="#1c2128" font-family="ui-monospace, Consolas, 'SF Mono', monospace">autons.cpp</text>
  <text x="68" y="204" font-size="13" fill="#6b7581">the team's routines · unmodified</text>
  <g font-family="ui-monospace, Consolas, 'SF Mono', monospace" font-size="12.5" fill="#1c2128">
    <text x="68" y="240" fill="#8b949e">#include "vex.h"</text>
    <text x="68" y="266">intake_hold(100);</text>
    <text x="68" y="290">chassis.drive_distance(</text>
    <text x="98" y="312">45/2.54, -32, 6, 6);</text>
    <text x="68" y="336">matchload.set(true);</text>
    <text x="68" y="360">chassis.turn_to_angle(</text>
    <text x="98" y="382">-123, 8);</text>
  </g>

  <line x1="318" y1="285" x2="364" y2="285" stroke="#6b7581" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ column 2: compile ============ -->
  <rect x="368" y="200" width="232" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="388" y="232" font-size="17" font-weight="600" fill="#1c2128">Compile</text>
  <text x="388" y="256" font-size="13" fill="#6b7581">needs only the signature:</text>
  <g font-family="ui-monospace, Consolas, 'SF Mono', monospace" font-size="12" fill="#1c2128">
    <text x="388" y="282">Drive::drive_distance(</text>
    <text x="416" y="302">float, float,</text>
    <text x="416" y="322">float, float)</text>
  </g>
  <text x="388" y="352" font-size="12.5" fill="#6b7581">the body comes later, from the linker</text>

  <!-- the fork -->
  <line x1="600" y1="285" x2="632" y2="285" stroke="#6b7581" stroke-width="2"/>
  <line x1="632" y1="190" x2="632" y2="460" stroke="#6b7581" stroke-width="2"/>
  <line x1="632" y1="190" x2="664" y2="190" stroke="#b5651d" stroke-width="2" marker-end="url(#arrO)"/>
  <line x1="632" y1="460" x2="664" y2="460" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- ============ lane 1: on the brain ============ -->
  <text x="668" y="128" font-size="12" font-weight="600" letter-spacing="1.4" fill="#b5651d">ON THE V5 BRAIN</text>

  <rect x="668" y="140" width="140" height="100" rx="10" fill="#fdf3e6" stroke="#e8c79d"/>
  <text x="682" y="168" font-size="15" font-weight="600" fill="#1c2128">Linker</text>
  <text x="682" y="192" font-size="11.5" fill="#1c2128" font-family="ui-monospace, Consolas, monospace">template/drive.cpp</text>
  <text x="682" y="214" font-size="12" fill="#6b7581">teacher-supplied</text>

  <line x1="808" y1="190" x2="836" y2="190" stroke="#b5651d" stroke-width="2" marker-end="url(#arrO)"/>

  <rect x="840" y="140" width="140" height="100" rx="10" fill="#fdf3e6" stroke="#e8c79d"/>
  <text x="854" y="168" font-size="15" font-weight="600" fill="#1c2128">PID at 10 ms</text>
  <text x="854" y="192" font-size="10.5" fill="#1c2128" font-family="ui-monospace, Consolas, monospace">drive_with_voltage()</text>
  <text x="854" y="214" font-size="12" fill="#6b7581">the real control loop</text>

  <line x1="980" y1="190" x2="1008" y2="190" stroke="#b5651d" stroke-width="2" marker-end="url(#arrO)"/>

  <rect x="1012" y="140" width="140" height="100" rx="10" fill="#fdf3e6" stroke="#e8c79d"/>
  <text x="1026" y="168" font-size="15" font-weight="600" fill="#1c2128">Motors</text>
  <text x="1026" y="192" font-size="12" fill="#1c2128">the robot drives</text>
  <text x="1026" y="214" font-size="12" font-weight="600" fill="#b5651d">5–10 min per test</text>

  <!-- ============ the seam ============ -->
  <rect x="668" y="276" width="484" height="92" rx="10" fill="#ffffff" stroke="#9aa4b2" stroke-dasharray="6 5"/>
  <text x="688" y="302" font-size="12" font-weight="600" letter-spacing="1.4" fill="#1c2128">THE SEAM</text>
  <text x="688" y="326" font-size="13.5" fill="#1c2128">The linker matches names and parameter types.</text>
  <text x="688" y="348" font-size="13.5" fill="#1c2128">It never looks at what a body does — so either body fits.</text>

  <!-- ============ lane 2: on a laptop ============ -->
  <text x="668" y="398" font-size="12" font-weight="600" letter-spacing="1.4" fill="#2f6fb0">ON A LAPTOP</text>

  <rect x="668" y="410" width="140" height="112" rx="10" fill="#eaf2fa" stroke="#b6d0ea"/>
  <text x="682" y="438" font-size="15" font-weight="600" fill="#1c2128">Linker</text>
  <text x="682" y="462" font-size="11.5" fill="#1c2128" font-family="ui-monospace, Consolas, monospace">mock/drive.cpp</text>
  <text x="682" y="484" font-size="12" fill="#6b7581">records every call,</text>
  <text x="682" y="502" font-size="12" fill="#6b7581">drives nothing</text>

  <line x1="808" y1="460" x2="836" y2="460" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="840" y="410" width="140" height="112" rx="10" fill="#eaf2fa" stroke="#b6d0ea"/>
  <text x="854" y="438" font-size="15" font-weight="600" fill="#1c2128">Action log</text>
  <text x="854" y="462" font-size="11.5" fill="#1c2128" font-family="ui-monospace, Consolas, monospace">out/logs.js</text>
  <text x="854" y="484" font-size="12" fill="#6b7581">each command, plus the</text>
  <text x="854" y="502" font-size="12" fill="#6b7581">gains + timeouts in force</text>

  <line x1="980" y1="460" x2="1008" y2="460" stroke="#2f6fb0" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="1012" y="410" width="140" height="112" rx="10" fill="#eaf2fa" stroke="#b6d0ea"/>
  <text x="1026" y="438" font-size="15" font-weight="600" fill="#1c2128">Viewer</text>
  <text x="1026" y="462" font-size="10.5" fill="#1c2128" font-family="ui-monospace, Consolas, monospace">sim.js · collide.js</text>
  <text x="1026" y="484" font-size="12" fill="#6b7581">PID.cpp replayed,</text>
  <text x="1026" y="502" font-size="12" font-weight="600" fill="#2f6fb0">about 2 s per test</text>

  <!-- ============ bottom strip ============ -->
  <rect x="48" y="580" width="1104" height="72" rx="12" fill="#eaf2fa"/>
  <rect x="48" y="580" width="4" height="72" fill="#2f6fb0"/>
  <text x="72" y="611" font-size="15" font-weight="600" fill="#1c2128">Same file, byte for byte, in both lanes: what is simulated is exactly what gets uploaded.</text>
  <text x="72" y="635" font-size="13.5" fill="#6b7581">No C++ is parsed or interpreted anywhere. The mock is chosen with one compiler flag: g++ -I mock</text>
</svg>
